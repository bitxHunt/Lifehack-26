# Render blueprint. With this file in the repo root, Render configures the
# service itself -- no clicking through settings.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: agentshelf
    runtime: python
    plan: free
    # Nothing to install (stdlib only), but Render expects a build step.
    buildCommand: "echo no dependencies"
    # HOST=0.0.0.0 so the container is reachable; Render supplies $PORT.
    startCommand: "python run.py --host 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
